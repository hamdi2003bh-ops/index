<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche étudiant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Photo de l'homme dans le coin (dessinée en CSS).
       Pour une vraie photo, remplace le bloc .avatar par :
       <img src="ma-photo.jpg" alt="Photo" style="width:120px;height:120px;border-radius:12px;border:4px solid #fff;object-fit:cover"> -->
  <div class="corner">
    <div class="avatar" aria-label="Photo de l'étudiant">
      <div class="body"></div>
      <div class="neck"></div>
      <div class="hair"></div>
      <div class="head">
        <span class="eye l"></span><span class="eye r"></span>
        <span class="smile"></span>
      </div>
    </div>
    hamdi bahri
  </div>

  <!-- Écran -->
  <div class="monitor">
    <div class="screen">
      <div class="titlebar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span>Fiche étudiant</span></div>
      <div class="card">
        <h1>Informations de l’étudiant</h1>
        <table>
          <tr><th>Nom</th><td>bahri</td></tr>
          <tr><th>Prénom</th><td>hamdi</td></tr>
          <tr><th>Date de naissance</th><td>16/04/2003</td></tr>
          <tr><th>N° étudiant</th><td>2022-004512</td></tr>
          <tr><th>Filière</th><td>Informatique</td></tr>
          <tr><th>Niveau</th><td>3ème année licence</td></tr>
          <tr><th>Email</th><td>hamdibh@gmail.com</td></tr>
          <tr><th>Moyenne</th><td>14,5 / 20</td></tr>
        </table>
      </div>
    </div>
  </div>

  <div class="stand"></div>
  <div class="base"></div>

  <!-- Clavier -->
  <div class="keyboard" aria-hidden="true">
    <div class="row"><span class="key">1</span><span class="key">2</span><span class="key">3</span><span class="key">4</span><span class="key">5</span><span class="key">6</span><span class="key">7</span><span class="key">8</span><span class="key">9</span><span class="key">0</span></div>
    <div class="row"><span class="key">A</span><span class="key">Z</span><span class="key">E</span><span class="key">R</span><span class="key">T</span><span class="key">Y</span><span class="key">U</span><span class="key">I</span><span class="key">O</span><span class="key">P</span></div>
    <div class="row"><span class="key">Q</span><span class="key">S</span><span class="key">D</span><span class="key">F</span><span class="key">G</span><span class="key">H</span><span class="key">J</span><span class="key">K</span><span class="key">L</span><span class="key">M</span></div>
    <div class="row"><span class="key wide">Shift</span><span class="key space"></span><span class="key wide">Enter</span></div>
  </div>

</body>
</html>
